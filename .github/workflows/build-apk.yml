name: Generar APK de prueba

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "android/**"
      - "scripts/check-android-artifact.py"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: "9.4.1"

      - name: Validar configuración Android
        env:
          FUNCTIONS_URL: ${{ vars.SUPABASE_FUNCTIONS_URL }}
          PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          MAPS_ANDROID_KEY: ${{ vars.GOOGLE_MAPS_ANDROID_API_KEY }}
          MAPS_ANDROID_ID: ${{ vars.GOOGLE_MAPS_ANDROID_MAP_ID }}
        run: |
          set -euo pipefail
          test -n "$FUNCTIONS_URL" || { echo "::error::Falta SUPABASE_FUNCTIONS_URL"; exit 1; }
          test -n "$PUBLISHABLE_KEY" || { echo "::error::Falta SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          test -n "$MAPS_ANDROID_KEY" || { echo "::error::Falta GOOGLE_MAPS_ANDROID_API_KEY"; exit 1; }
          test -n "$MAPS_ANDROID_ID" || { echo "::error::Falta GOOGLE_MAPS_ANDROID_MAP_ID"; exit 1; }
          test "$MAPS_ANDROID_KEY" != "$MAPS_ANDROID_ID" || {
            echo "::error::La API key Android y el Map ID Android no pueden ser iguales."
            exit 1
          }

      - name: Compilar APK debug
        working-directory: android
        env:
          FUNCTIONS_URL: ${{ vars.SUPABASE_FUNCTIONS_URL }}
          PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          MAPS_ANDROID_KEY: ${{ vars.GOOGLE_MAPS_ANDROID_API_KEY }}
          MAPS_ANDROID_ID: ${{ vars.GOOGLE_MAPS_ANDROID_MAP_ID }}
          PLAY_PROJECT_NUMBER: ${{ vars.PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache \
            -PCOMBUSPLUS_FUNCTIONS_URL="$FUNCTIONS_URL" \
            -PCOMBUSPLUS_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
            -PGOOGLE_MAPS_ANDROID_API_KEY="$MAPS_ANDROID_KEY" \
            -PGOOGLE_MAPS_ANDROID_MAP_ID="$MAPS_ANDROID_ID" \
            -PPLAY_INTEGRITY_CLOUD_PROJECT_NUMBER="${PLAY_PROJECT_NUMBER:-0}"

      - name: Comprobar seguridad del APK
        run: |
          python scripts/check-android-artifact.py \
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Preparar artefacto
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Combusplus-v9.4-debug.apk
          sha256sum release/Combusplus-v9.4-debug.apk > release/Combusplus-v9.4-debug.apk.sha256

      - name: Subir APK
        uses: actions/upload-artifact@v7
        with:
          name: Combusplus-APK-${{ github.run_number }}-${{ github.run_attempt }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
