name: Generar APK de prueba

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Compilar APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Combusplus-debug.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Combusplus-APK
          path: Combusplus-debug.apk
          retention-days: 30
