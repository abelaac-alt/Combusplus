name: Generar APK de prueba

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "android/**"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Aplicar mapa integrado
        run: python scripts/apply-embedded-map-patch.py

      - name: Fijar mapa dentro del recuadro
        run: python scripts/fix-embedded-map-position.py

      - name: Optimizar mapa y cargar cercanas
        run: python scripts/optimize-nearby-map.py

      - name: Aplicar marcadores de precio y filtro
        run: python scripts/fix-map-price-markers-and-filter.py

      - name: Aplicar marco exacto y logotipos
        run: python scripts/fix-perfect-map-frame-and-branding.py

      - name: Fijar menú, eliminar hueco y renovar widgets
        run: python scripts/fix-static-nav-gap-and-widgets.py

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.4.1"

      - name: Compilar APK debug
        working-directory: android
        env:
          FUNCTIONS_URL: ${{ vars.SUPABASE_FUNCTIONS_URL }}
          PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          MAPS_ANDROID_KEY: ${{ vars.GOOGLE_MAPS_ANDROID_API_KEY }}
          MAPS_ANDROID_ID: ${{ vars.GOOGLE_MAPS_ANDROID_MAP_ID }}
          PLAY_PROJECT_NUMBER: ${{ vars.PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            --no-configuration-cache \
            -PCOMBUSPLUS_FUNCTIONS_URL="$FUNCTIONS_URL" \
            -PCOMBUSPLUS_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
            -PGOOGLE_MAPS_ANDROID_API_KEY="$MAPS_ANDROID_KEY" \
            -PGOOGLE_MAPS_ANDROID_MAP_ID="$MAPS_ANDROID_ID" \
            -PPLAY_INTEGRITY_CLOUD_PROJECT_NUMBER="${PLAY_PROJECT_NUMBER:-0}"

      - name: Preparar artefacto
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Combusplus-v9.7-debug.apk
          sha256sum release/Combusplus-v9.7-debug.apk > release/Combusplus-v9.7-debug.apk.sha256

      - name: Subir APK
        uses: actions/upload-artifact@v7
        with:
          name: Combusplus-APK-${{ github.run_number }}-${{ github.run_attempt }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
