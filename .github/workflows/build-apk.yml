name: Generar APK de prueba

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "web/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.4.1"

      - name: Copiar la web dentro de la APK
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -R web/. android/app/src/main/assets/www/

          test -f android/app/src/main/assets/www/index.html
          echo "Web copiada correctamente dentro de Android"

      - name: Compilar APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Preparar APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release/Combusplus-debug.apk

          ls -lh release/Combusplus-debug.apk
          sha256sum release/Combusplus-debug.apk

      - name: Subir APK
        uses: actions/upload-artifact@v7
        with:
          name: Combusplus-APK-${{ github.run_number }}-${{ github.run_attempt }}
          path: release/Combusplus-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
