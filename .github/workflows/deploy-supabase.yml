name: Desplegar Supabase

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"

permissions:
  contents: read

jobs:
  deploy-supabase:
    name: Desplegar base de datos y funciones
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      PRECIOIL_API_KEY: ${{ secrets.PRECIOIL_API_KEY }}
      COMBUSPLUS_APP_ACCESS_TOKEN: ${{ secrets.COMBUSPLUS_APP_ACCESS_TOKEN }}
      COMBUSPLUS_SYNC_SECRET: ${{ secrets.COMBUSPLUS_SYNC_SECRET }}
      COMBUSPLUS_SYNC_POINTS_JSON: ${{ secrets.COMBUSPLUS_SYNC_POINTS_JSON }}

      COMBUSPLUS_ALLOWED_ORIGINS: ${{ vars.COMBUSPLUS_ALLOWED_ORIGINS }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Mostrar versión de Supabase CLI
        run: supabase --version

      - name: Comprobar secretos principales
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          check_required() {
            variable_name="$1"
            variable_value="$2"

            if [ -z "$variable_value" ]; then
              echo "::error::$variable_name no está configurado en GitHub."
              missing=1
            else
              echo "✓ $variable_name está configurado"
            fi
          }

          check_required "SUPABASE_ACCESS_TOKEN" "$SUPABASE_ACCESS_TOKEN"
          check_required "SUPABASE_PROJECT_ID" "$PROJECT_ID"
          check_required "SUPABASE_DB_PASSWORD" "$SUPABASE_DB_PASSWORD"
          check_required "PRECIOIL_API_KEY" "$PRECIOIL_API_KEY"
          check_required "COMBUSPLUS_APP_ACCESS_TOKEN" "$COMBUSPLUS_APP_ACCESS_TOKEN"
          check_required "COMBUSPLUS_SYNC_SECRET" "$COMBUSPLUS_SYNC_SECRET"
          check_required "COMBUSPLUS_SYNC_POINTS_JSON" "$COMBUSPLUS_SYNC_POINTS_JSON"
          check_required "COMBUSPLUS_ALLOWED_ORIGINS" "$COMBUSPLUS_ALLOWED_ORIGINS"

          if [ "$missing" -ne 0 ]; then
            echo "::error::Faltan secretos o variables obligatorias."
            exit 1
          fi

          if [[ "$SUPABASE_ACCESS_TOKEN" != sbp_* ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN debe ser un Personal Access Token que comience por sbp_."
            exit 1
          fi

          echo "Configuración principal comprobada correctamente."

      - name: Comprobar estructura de Supabase
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "supabase" ]; then
            echo "::error::No existe la carpeta supabase en la raíz del repositorio."
            exit 1
          fi

          if [ ! -f "supabase/config.toml" ]; then
            echo "::error::No existe supabase/config.toml."
            exit 1
          fi

          if [ ! -d "supabase/functions" ]; then
            echo "::error::No existe la carpeta supabase/functions."
            exit 1
          fi

          echo "Contenido de supabase/functions:"
          find supabase/functions -maxdepth 2 -type f -print

      - name: Enlazar proyecto de Supabase
        shell: bash
        run: |
          set -euo pipefail

          supabase link \
            --project-ref "$PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Aplicar migraciones de base de datos
        shell: bash
        run: |
          set -euo pipefail

          supabase db push \
            --linked \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Configurar secretos de Edge Functions
        shell: bash
        run: |
          set -euo pipefail

          supabase secrets set \
            --project-ref "$PROJECT_ID" \
            PRECIOIL_API_KEY="$PRECIOIL_API_KEY" \
            COMBUSPLUS_APP_ACCESS_TOKEN="$COMBUSPLUS_APP_ACCESS_TOKEN" \
            COMBUSPLUS_SYNC_SECRET="$COMBUSPLUS_SYNC_SECRET" \
            COMBUSPLUS_SYNC_POINTS_JSON="$COMBUSPLUS_SYNC_POINTS_JSON" \
            COMBUSPLUS_ALLOWED_ORIGINS="$COMBUSPLUS_ALLOWED_ORIGINS"

      - name: Desplegar Edge Functions
        shell: bash
        run: |
          set -euo pipefail

          supabase functions deploy \
            --project-ref "$PROJECT_ID"

      - name: Confirmar despliegue
        shell: bash
        run: |
          echo "Supabase desplegado correctamente."
          echo "Proyecto: $PROJECT_ID"
          echo "Las migraciones y Edge Functions han sido actualizadas."
