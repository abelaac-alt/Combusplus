name: Desplegar Supabase

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Enlazar proyecto
        run: |
          supabase link \
            --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Aplicar base de datos
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Configurar secretos de funciones
        run: |
          supabase secrets set \
            PRECIOIL_API_KEY="${{ secrets.PRECIOIL_API_KEY }}" \
            COMBUSPLUS_APP_ACCESS_TOKEN="${{ secrets.COMBUSPLUS_APP_ACCESS_TOKEN }}" \
            COMBUSPLUS_SYNC_SECRET="${{ secrets.COMBUSPLUS_SYNC_SECRET }}" \
            COMBUSPLUS_SYNC_POINTS_JSON='${{ secrets.COMBUSPLUS_SYNC_POINTS_JSON }}' \
            COMBUSPLUS_ALLOWED_ORIGINS="${{ vars.COMBUSPLUS_ALLOWED_ORIGINS }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Desplegar stations-nearby
        run: supabase functions deploy stations-nearby
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Desplegar sync-stations
        run: supabase functions deploy sync-stations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
