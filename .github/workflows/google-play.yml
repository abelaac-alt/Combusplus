name: Crear y publicar AAB en Google Play

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Código de versión. Debe ser superior al publicado."
        required: true
        default: "52"
        type: string
      version_name:
        description: "Nombre de versión visible."
        required: true
        default: "10.6.3"
        type: string
      publish:
        description: "Publicar automáticamente en Google Play."
        required: true
        default: false
        type: boolean
      track:
        description: "Canal de Google Play."
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: "Estado de la versión."
        required: true
        default: "draft"
        type: choice
        options:
          - draft
          - completed

permissions:
  contents: read

concurrency:
  group: google-play-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-play:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verificar frontend antes del AAB
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm run check

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validar variables y secretos
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          ALIAS_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PUBLISH: ${{ inputs.publish }}
          FUNCTIONS_URL: ${{ vars.SUPABASE_FUNCTIONS_URL }}
          PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          MAPS_ANDROID_KEY: ${{ vars.GOOGLE_MAPS_ANDROID_API_KEY }}
          MAPS_ANDROID_ID: ${{ vars.GOOGLE_MAPS_ANDROID_MAP_ID }}
        run: |
          set -euo pipefail

          required=(
            KEYSTORE_B64
            STORE_PASSWORD
            ALIAS
            ALIAS_PASSWORD
            FUNCTIONS_URL
            PUBLISHABLE_KEY
            MAPS_ANDROID_KEY
            MAPS_ANDROID_ID
          )

          for name in "${required[@]}"; do
            test -n "${!name:-}" || {
              echo "::error::$name no está configurado."
              exit 1
            }
          done

          if [ "$PUBLISH" = "true" ]; then
            test -n "$PLAY_JSON" || {
              echo "::error::Falta GOOGLE_PLAY_SERVICE_ACCOUNT_JSON."
              exit 1
            }
          fi

      - name: Restaurar y comprobar clave de subida
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/combusplus-upload.jks"

          printf '%s' "$KEYSTORE_B64"             | tr -d '\r\n\t '             | base64 --decode             > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH" || {
            echo "::error::El archivo JKS reconstruido está vacío."
            exit 1
          }

          chmod 600 "$KEYSTORE_PATH"

          keytool -list             -keystore "$KEYSTORE_PATH"             -storepass "$STORE_PASSWORD"             -alias "$ALIAS"             >/dev/null

          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Crear Android App Bundle firmado
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FUNCTIONS_URL: ${{ vars.SUPABASE_FUNCTIONS_URL }}
          PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          MAPS_ANDROID_KEY: ${{ vars.GOOGLE_MAPS_ANDROID_API_KEY }}
          MAPS_ANDROID_ID: ${{ vars.GOOGLE_MAPS_ANDROID_MAP_ID }}
          PLAY_PROJECT_NUMBER: ${{ vars.PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
        run: |
          set -euo pipefail

          ./gradlew :app:bundleRelease             --stacktrace             --no-daemon             --no-configuration-cache             -PCOMBUSPLUS_FUNCTIONS_URL="$FUNCTIONS_URL"             -PCOMBUSPLUS_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"             -PGOOGLE_MAPS_ANDROID_API_KEY="$MAPS_ANDROID_KEY"             -PGOOGLE_MAPS_ANDROID_MAP_ID="$MAPS_ANDROID_ID"             -PCOMBUSPLUS_VERSION_CODE="${{ inputs.version_code }}"             -PCOMBUSPLUS_VERSION_NAME="${{ inputs.version_name }}"             -PPLAY_INTEGRITY_CLOUD_PROJECT_NUMBER="${PLAY_PROJECT_NUMBER:-0}"

      - name: Verificar firma del AAB
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -certs "$AAB"

      - name: Comprobar seguridad del AAB
        run: python scripts/check-android-artifact.py android/app/build/outputs/bundle/release/app-release.aab

      - name: Preparar archivos de Google Play
        run: |
          set -euo pipefail
          mkdir -p release/google-play

          cp             android/app/build/outputs/bundle/release/app-release.aab             "release/google-play/Combusplus-${{ inputs.version_name }}-${{ inputs.version_code }}.aab"

          if [ -f android/app/build/outputs/mapping/release/mapping.txt ]; then
            cp               android/app/build/outputs/mapping/release/mapping.txt               release/google-play/mapping.txt
          fi

          sha256sum             release/google-play/*.aab             > release/google-play/SHA256SUMS.txt

      - name: Guardar AAB para Google Play
        uses: actions/upload-artifact@v7
        with:
          name: Combusplus-Google-Play-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: release/google-play/*
          if-no-files-found: error
          retention-days: 60
          compression-level: 0

      - name: Publicar en Google Play
        if: ${{ inputs.publish }}
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.grupomds.combusplus
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ inputs.track }}
          status: ${{ inputs.status }}
          releaseName: Combusplus ${{ inputs.version_name }}
          whatsNewDirectory: distribution/whatsnew
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          changesNotSentForReview: false
