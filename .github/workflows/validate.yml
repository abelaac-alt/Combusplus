name: Validar proyecto

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "android/**"
      - "patches/**"
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validar Combusplus
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Comprobar secretos expuestos
        run: |
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact --config .gitleaks.toml

      - name: Configurar Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Probar frontend generado
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm run check

      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.8.1"

      - name: Comprobar todas las funciones Supabase
        run: deno check supabase/functions/**/*.ts

      - name: Probar la lógica del backend
        run: deno test supabase/tests

      - name: Validar funciones nuevas
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("web/src/app.js").read_text(encoding="utf-8")
          index = Path("web/index.html").read_text(encoding="utf-8")

          checks = {
              "función de depósito única":
                  app.count(
                      "async function runFullTankSearch({"
                  ) == 1,
              "destino disponible":
                  'id="quickDestination"' in index,
              "backend de ruta":
                  "route-recommend" in app,
              "desvío máximo":
                  "maxDetourKm" in app,
              "resumen de ruta":
                  "renderRouteSummaryV106" in app,
          }

          failed = [
              name
              for name, ok in checks.items()
              if not ok
          ]

          if failed:
              raise RuntimeError(
                  "Validaciones fallidas: "
                  + ", ".join(failed)
              )

          print(
              "Combusplus 10.6.3 validado correctamente"
          )
          PY
