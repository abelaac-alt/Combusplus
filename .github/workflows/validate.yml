name: Validar proyecto

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "android/**"
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Aplicar mapa integrado
        run: python scripts/apply-embedded-map-patch.py

      - name: Fijar mapa
        run: python scripts/fix-embedded-map-position.py

      - name: Optimizar mapa
        run: python scripts/optimize-nearby-map.py

      - name: Corregir overlay
        run: python scripts/fix-map-overlay-and-logo.py

      - name: Aplicar mapa cuadrado y branding
        run: python scripts/fix-map-square-and-branding.py

      - name: Aplicar marcadores de precio y filtro
        run: python scripts/fix-map-price-markers-and-filter.py

      - name: Configurar Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Probar frontend
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm test
          node --check src/app.js
          node --check src/core.js
          node --check src/admin-analytics.js

      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Comprobar Edge Functions
        run: |
          set -euo pipefail
          deno check supabase/functions/bootstrap/index.ts
          deno check supabase/functions/recommend/index.ts
          deno check supabase/functions/compare-stations/index.ts
          deno check supabase/functions/stations-nearby/index.ts
          deno check supabase/functions/station-history/index.ts
          deno check supabase/functions/sync-stations/index.ts
          deno check supabase/functions/analytics-event/index.ts
          deno check supabase/functions/admin-analytics/index.ts
          deno check supabase/functions/health/index.ts

      - name: Validar mapa y filtros
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          failures = []

          def check(condition, label):
              if not condition:
                  failures.append(label)

          controller_path = Path(
              'android/app/src/main/java/com/grupomds/combusplus/EmbeddedMapController.java'
          )
          app_path = Path('web/src/app.js')
          index_path = Path('web/index.html')
          styles_path = Path('web/assets/styles.css')

          check(controller_path.is_file(), 'controlador Android del mapa')
          check(app_path.is_file(), 'lógica web del mapa')
          check(index_path.is_file(), 'estructura HTML del mapa')
          check(styles_path.is_file(), 'estilos del mapa')

          controller = controller_path.read_text(encoding='utf-8') if controller_path.is_file() else ''
          app = app_path.read_text(encoding='utf-8') if app_path.is_file() else ''
          index = index_path.read_text(encoding='utf-8') if index_path.is_file() else ''
          styles = styles_path.read_text(encoding='utf-8') if styles_path.is_file() else ''

          # El borde rojo puede estar implementado en CSS o en el contenedor nativo.
          css_red_border = bool(re.search(
              r'border\s*:\s*(?:2|3|4)px\s+solid\s+(?:#d1131b|#D1131B|#b3131b|#B3131B)',
              styles,
          ))
          native_red_frame = (
              'container.setBackgroundColor(0xFFD1131B)' in controller
              or 'container.setBackgroundColor(0xFFB3131B)' in controller
          )
          check(css_red_border or native_red_frame, 'borde rojo del mapa')

          # Las medidas incluyen correctamente el borde si se usa border-box en CSS
          # o padding rojo en el contenedor nativo.
          css_includes_border = (
              'box-sizing:border-box' in styles.replace(' ', '')
              or 'box-sizing: border-box' in styles
          )
          native_includes_border = bool(re.search(
              r'container\.setPadding\(dp\((?:2|3|4)\),\s*dp\((?:2|3|4)\),\s*dp\((?:2|3|4)\),\s*dp\((?:2|3|4)\)\)',
              controller,
          ))
          check(css_includes_border or native_includes_border, 'medidas incluyen borde')

          check('setOnMarkerClickListener' in controller, 'apertura de ficha desde marcador')
          check('hide();' in controller and 'openStationFromNative' in controller,
                'ocultar mapa al abrir ficha')
          check('favorite' in controller.lower(), 'marcador de favoritos')

          # Marcadores circulares con precio: se acepta implementación nativa o web.
          price_marker_native = (
              'drawText' in controller
              and ('drawCircle' in controller or 'Circle' in controller)
          )
          price_marker_web = (
              'price' in app.lower()
              and ('marker' in app.lower() or 'map' in app.lower())
          )
          check(price_marker_native or price_marker_web, 'marcadores circulares con precio')

          open_filter_present = any(token in (index + app).lower() for token in [
              'solo abiertas',
              'gasolineras abiertas',
              'mostrar abiertas',
              'openonly',
              'open_only',
              'filteropen',
          ])
          check(open_filter_present, 'filtro de gasolineras abiertas')

          if failures:
              raise RuntimeError('Validaciones fallidas: ' + ', '.join(failures))

          print('Validación del mapa completada correctamente')
          PY

      - name: Comprobar scripts Python
        run: |
          python -m py_compile scripts/apply-embedded-map-patch.py
          python -m py_compile scripts/fix-embedded-map-position.py
          python -m py_compile scripts/optimize-nearby-map.py
          python -m py_compile scripts/fix-map-overlay-and-logo.py
          python -m py_compile scripts/fix-map-square-and-branding.py
          python -m py_compile scripts/fix-map-price-markers-and-filter.py
