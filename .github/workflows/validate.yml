name: Validar proyecto

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "android/**"
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Aplicar mapa integrado
        run: python scripts/apply-embedded-map-patch.py

      - name: Fijar mapa
        run: python scripts/fix-embedded-map-position.py

      - name: Optimizar mapa
        run: python scripts/optimize-nearby-map.py

      - name: Corregir overlay
        run: python scripts/fix-map-overlay-and-logo.py

      - name: Aplicar mapa cuadrado
        run: python scripts/fix-map-square-and-branding.py

      - name: Aplicar marcadores de precio y filtro
        run: python scripts/fix-map-price-markers-and-filter.py

      - name: Configurar Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Probar frontend
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm test
          node --check src/app.js
          node --check src/core.js
          node --check src/admin-analytics.js

      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Comprobar Edge Functions
        run: |
          set -euo pipefail
          deno check supabase/functions/bootstrap/index.ts
          deno check supabase/functions/recommend/index.ts
          deno check supabase/functions/compare-stations/index.ts
          deno check supabase/functions/stations-nearby/index.ts
          deno check supabase/functions/station-history/index.ts
          deno check supabase/functions/sync-stations/index.ts
          deno check supabase/functions/analytics-event/index.ts
          deno check supabase/functions/admin-analytics/index.ts
          deno check supabase/functions/health/index.ts

      - name: Validar mapa y marcadores
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          required = [
              'android/app/src/main/java/com/grupomds/combusplus/EmbeddedMapController.java',
              'scripts/fix-map-price-markers-and-filter.py',
              'web/src/app.js',
              'web/index.html',
              'web/assets/styles.css',
          ]

          missing = [item for item in required if not Path(item).is_file()]
          if missing:
              raise RuntimeError('Faltan archivos: ' + ', '.join(missing))

          controller = Path(required[0]).read_text(encoding='utf-8')
          app = Path('web/src/app.js').read_text(encoding='utf-8')
          index = Path('web/index.html').read_text(encoding='utf-8')
          styles = Path('web/assets/styles.css').read_text(encoding='utf-8')

          # Valida el resultado real, no el nombre de un comentario de versión.
          map_rule_match = re.search(
              r'(?:\.page\[data-page=["\']map["\']\]\s+#googleMap|#page-map\s+#googleMap)\s*\{(.*?)\}',
              styles,
              flags=re.S,
          )
          if not map_rule_match:
              raise RuntimeError('Validaciones fallidas: regla CSS principal del mapa')

          map_rule = map_rule_match.group(1)
          has_red_border = bool(re.search(
              r'border\s*:\s*(?:2|3|4)px\s+solid\s+#(?:d1131b|D1131B|d1131b)\s*!important',
              map_rule,
              flags=re.I,
          ))
          has_box_sizing = 'box-sizing:border-box' in re.sub(r'\s+', '', map_rule).lower()
          has_overflow_hidden = 'overflow:hidden' in re.sub(r'\s+', '', map_rule).lower()

          # Los contenedores externos no deben dibujar otro borde.
          wrappers_rule = re.findall(
              r'(?:\.map-card|\.map-frame|\.map-panel)[^{]*\{(.*?)\}',
              styles,
              flags=re.S,
          )
          wrappers_borderless = any(
              re.search(r'border\s*:\s*0\s*!important', rule, flags=re.I)
              for rule in wrappers_rule
          )

          checks = {
              'círculo de precio': 'priceMarker(price, favorite)' in controller,
              'color rojo': '0xFFD1131B' in controller,
              'color favorito amarillo': '0xFFFFC107' in controller,
              'sin borde nativo duplicado': 'container.setBackgroundColor(Color.TRANSPARENT)' in controller,
              'ocultar mapa al abrir ficha': 'hide();\n                    activity.openStationFromNative(id);' in controller,
              'filtro abiertas HTML': 'id="mapOpenOnly"' in index,
              'filtro abiertas JS': 'station.isOpen === true' in app,
              'protección de diálogo': 'nativeMapModalObserver' in app,
              'borde rojo del mapa': has_red_border,
              'mapa recortado': has_overflow_hidden,
              'medidas incluyen borde': has_box_sizing,
              'sin segundo borde exterior': wrappers_borderless,
          }

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise RuntimeError('Validaciones fallidas: ' + ', '.join(failed))

          print('Mapa, marcadores de precio, filtro y marco validados')
          PY

      - name: Comprobar script Python
        run: python -m py_compile scripts/fix-map-price-markers-and-filter.py
