name: Validar proyecto

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "android/**"
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Aplicar mapa integrado
        run: python scripts/apply-embedded-map-patch.py

      - name: Fijar mapa
        run: python scripts/fix-embedded-map-position.py

      - name: Optimizar mapa
        run: python scripts/optimize-nearby-map.py

      - name: Aplicar marcadores de precio y filtro
        run: python scripts/fix-map-price-markers-and-filter.py

      - name: Aplicar marco exacto y logotipos
        run: python scripts/fix-perfect-map-frame-and-branding.py

      - name: Fijar menú, eliminar hueco y renovar widgets
        run: python scripts/fix-static-nav-gap-and-widgets.py

      - name: Configurar Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Probar frontend
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm test
          node --check src/app.js
          node --check src/core.js
          node --check src/admin-analytics.js

      - name: Validar integración final
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          required = [
              'android/app/src/main/java/com/grupomds/combusplus/EmbeddedMapController.java',
              'android/app/src/main/res/drawable-nodpi/combusplus_header_logo.png',
              'android/app/src/main/res/drawable-nodpi/combusplus_app_icon.png',
              'web/assets/combusplus-header-logo.png',
              'scripts/fix-perfect-map-frame-and-branding.py',
          ]
          for name in required:
              if not Path(name).is_file():
                  raise RuntimeError(f'Falta {name}')

          ET.parse('android/app/src/main/AndroidManifest.xml')

          controller = Path('android/app/src/main/java/com/grupomds/combusplus/EmbeddedMapController.java').read_text(encoding='utf-8')
          checks = {
              'mapa ocupa todo el contenedor': 'MATCH_PARENT' in controller,
              'sin desplazamiento interno': 'mapParams.leftMargin' not in controller,
              'marco rojo nativo': 'container.setBackgroundColor(0xFFD1131B)' in controller,
              'padding del marco': 'container.setPadding(dp(3)' in controller,
              'oculta al abrir ficha': 'hide();\n                activity.openStationFromNative(id);' in controller,
          }

          app = Path('web/src/app.js').read_text(encoding='utf-8')
          checks.update({
              'bloqueo con ficha abierta': 'mapOverlayOpen' in app,
              'observador de fichas': 'syncMapAgainstOverlays' in app,
              'logo transparente': 'applyTransparentHeaderLogoV968' in app,
          })

          styles = Path('web/assets/styles.css').read_text(encoding='utf-8')
          checks.update({
              'contenedor sin segundo borde': 'border:0 !important' in styles,
              'proporción cuadrada': 'aspect-ratio:1 / 1 !important' in styles,
          })

          manifest = Path('android/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          checks['icono instalado blanco'] = '@drawable/combusplus_app_icon' in manifest

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise RuntimeError('Validaciones fallidas: ' + ', '.join(failed))

          print('Mapa integrado y logotipos correctos')
          PY

      - name: Comprobar script Python
        run: python -m py_compile scripts/fix-perfect-map-frame-and-branding.py
