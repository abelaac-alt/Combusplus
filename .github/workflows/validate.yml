name: Validar proyecto

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "android/**"
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Aplicar mapa integrado
        run: python scripts/apply-embedded-map-patch.py

      - name: Fijar mapa
        run: python scripts/fix-embedded-map-position.py

      - name: Optimizar mapa
        run: python scripts/optimize-nearby-map.py

      - name: Corregir overlay
        run: python scripts/fix-map-overlay-and-logo.py

      - name: Aplicar mapa cuadrado y branding
        run: python scripts/fix-map-square-and-branding.py

      - name: Configurar Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Probar frontend
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm test
          node --check src/app.js
          node --check src/core.js
          node --check src/admin-analytics.js

      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Comprobar Edge Functions
        run: |
          set -euo pipefail
          deno check supabase/functions/bootstrap/index.ts
          deno check supabase/functions/recommend/index.ts
          deno check supabase/functions/compare-stations/index.ts
          deno check supabase/functions/stations-nearby/index.ts
          deno check supabase/functions/station-history/index.ts
          deno check supabase/functions/sync-stations/index.ts
          deno check supabase/functions/analytics-event/index.ts
          deno check supabase/functions/admin-analytics/index.ts
          deno check supabase/functions/health/index.ts

      - name: Validar mapa cuadrado
        run: |
          python - <<'PY'
          from pathlib import Path
          
          required = [
              'android/app/src/main/java/com/grupomds/combusplus/EmbeddedMapController.java',
              'android/app/src/main/res/drawable-nodpi/map_marker_default.png',
              'android/app/src/main/res/drawable-nodpi/map_marker_favorite.png',
              'android/app/src/main/res/drawable-nodpi/combusplus_app_logo.png',
              'web/assets/combusplus-app-logo.png',
              'scripts/fix-map-square-and-branding.py',
          ]
          for name in required:
              assert Path(name).is_file(), f'Falta {name}'

          controller = Path('android/app/src/main/java/com/grupomds/combusplus/EmbeddedMapController.java').read_text(encoding='utf-8')
          assert 'R.drawable.map_marker_default' in controller
          assert 'R.drawable.map_marker_favorite' in controller
          assert 'container.setBackgroundColor(0xFFD1131B);' in controller
          assert 'int side = Math.max(width, requestedHeight);' in controller

          app = Path('web/src/app.js').read_text(encoding='utf-8')
          assert '.slice(0, 40)' not in app
          assert '.slice(0, 80)' not in app
          assert 'applyCombusplusBrandingLogo' in app

          styles = Path('web/assets/styles.css').read_text(encoding='utf-8')
          assert 'Combusplus 9.6.2: mapa cuadrado con borde rojo' in styles
          assert 'aspect-ratio:1 / 1' in styles
          assert 'border:3px solid #d1131b' in styles
          
          print('Mapa cuadrado y marcadores personalizados correctos')
          PY

      - name: Comprobar script Python
        run: python -m py_compile scripts/fix-map-square-and-branding.py
