name: Validar proyecto

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "android/**"
      - "patches/**"
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Aplicar mapa integrado
        run: python scripts/apply-embedded-map-patch.py

      - name: Fijar mapa
        run: python scripts/fix-embedded-map-position.py

      - name: Optimizar mapa
        run: python scripts/optimize-nearby-map.py

      - name: Aplicar marcadores de precio y filtro
        run: python scripts/fix-map-price-markers-and-filter.py

      - name: Aplicar marco exacto y logotipos
        run: python scripts/fix-perfect-map-frame-and-branding.py

      - name: Fijar menú, eliminar hueco y renovar widgets
        run: python scripts/fix-static-nav-gap-and-widgets.py

      - name: Corregir mapa estático y widgets
        run: python scripts/fix-map-static-and-widget-actions.py

      - name: Corregir diseño final del mapa
        run: python scripts/fix-perfect-static-map-layout.py

      - name: Aplicar corrección exacta 10.1
        run: python scripts/apply-v101-exact-map.py

      - name: Configurar Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Probar frontend
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm test
          node --check src/app.js
          node --check src/core.js
          node --check src/admin-analytics.js

      - name: Validar integración 10.1
        run: |
          python - <<'PY'
          from pathlib import Path

          files = {
              "controller": Path("android/app/src/main/java/com/grupomds/combusplus/EmbeddedMapController.java"),
              "bridge": Path("android/app/src/main/java/com/grupomds/combusplus/WebBridge.java"),
              "activity": Path("android/app/src/main/java/com/grupomds/combusplus/MainActivity.java"),
              "app": Path("web/src/app.js"),
              "css": Path("web/assets/styles.css"),
          }
          for name, path in files.items():
              if not path.is_file():
                  raise RuntimeError(f"Falta {name}: {path}")

          controller = files["controller"].read_text(encoding="utf-8")
          bridge = files["bridge"].read_text(encoding="utf-8")
          activity = files["activity"].read_text(encoding="utf-8")
          app = files["app"].read_text(encoding="utf-8")
          css = files["css"].read_text(encoding="utf-8")

          checks = {
              "escala por ancho CSS": "webView.getWidth() / viewportWidthCss" in controller,
              "recorte en el inicio del menú": "navigationTop - dp(1)" in controller,
              "sin fondo rojo interno": "clipContainer.setBackgroundColor(Color.TRANSPARENT)" in controller,
              "puente V2": "renderNativeMapV2(" in bridge,
              "actividad V2": "renderEmbeddedMapV2(" in activity,
              "rectángulo interior del borde": "borderLeftWidth" in app and "borderTopWidth" in app,
              "posición del menú enviada a Android": "navigationTop" in app,
              "marcadores circulares": "canvas.drawCircle" in controller,
              "menú fijo": "z-index:2147483000" in css,
              "mapa con borde rojo único": "border:3px solid #d1131b" in css,
          }

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise RuntimeError("Validaciones fallidas: " + ", ".join(failed))

          print("Combusplus 10.1 validado correctamente")
          PY

      - name: Comprobar script Python
        run: python -m py_compile scripts/apply-v101-exact-map.py
