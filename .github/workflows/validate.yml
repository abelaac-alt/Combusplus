name: Validar proyecto

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "android/**"
      - "supabase/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Probar frontend
        working-directory: web
        run: |
          npm ci
          npm test
          node --check src/app.js
          node --check src/core.js
          grep -RInE 'sk_live_|service_role|SUPABASE_SERVICE_ROLE_KEY=' . && exit 1 || true

      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Comprobar Edge Functions
        run: |
          deno check supabase/functions/bootstrap/index.ts
          deno check supabase/functions/recommend/index.ts
          deno check supabase/functions/compare-stations/index.ts
          deno check supabase/functions/stations-nearby/index.ts
          deno check supabase/functions/station-history/index.ts
          deno check supabase/functions/sync-stations/index.ts
          deno check supabase/functions/health/index.ts

      - name: Validar XML y estructura
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('.')
          for path in (root/'android/app/src/main/res').rglob('*.xml'):
              ET.parse(path)
          ET.parse(root/'android/app/src/main/AndroidManifest.xml')
          required = [
              'web/index.html', 'web/privacy.html', 'web/src/app.js',
              'android/app/src/main/AndroidManifest.xml',
              'android/app/src/main/java/com/grupomds/combusplus/NativeSessionManager.java',
              'supabase/config.toml',
              'supabase/migrations/202608021800_v8_anonymous_installations.sql',
          ]
          for name in required:
              assert (root/name).exists(), f'Falta {name}'

          package = (root/'web/package.json').read_text(encoding='utf-8')
          gradle = (root/'android/app/build.gradle.kts').read_text(encoding='utf-8')
          health = (root/'supabase/functions/health/index.ts').read_text(encoding='utf-8')
          for content, source in [(package, 'web'), (gradle, 'android'), (health, 'backend')]:
              assert '9.0.0' in content, f'Versión incoherente en {source}'

          migration = (root/'supabase/migrations/202608021800_v8_anonymous_installations.sql').read_text(encoding='utf-8')
          assert 'p_history_retention_days' in migration
          assert 'p_sync_retention_days' in migration
          print('XML, estructura, migración y versiones correctos')
          PY
