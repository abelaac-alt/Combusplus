name: Validar proyecto

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "android/**"
      - "patches/**"
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Aplicar mapa integrado
        run: python scripts/apply-embedded-map-patch.py

      - name: Fijar mapa
        run: python scripts/fix-embedded-map-position.py

      - name: Optimizar mapa
        run: python scripts/optimize-nearby-map.py

      - name: Aplicar marcadores de precio y filtro
        run: python scripts/fix-map-price-markers-and-filter.py

      - name: Aplicar marco exacto y logotipos
        run: python scripts/fix-perfect-map-frame-and-branding.py

      - name: Fijar menú, eliminar hueco y renovar widgets
        run: python scripts/fix-static-nav-gap-and-widgets.py

      - name: Corregir mapa estático y widgets
        run: python scripts/fix-map-static-and-widget-actions.py

      - name: Corregir diseño final del mapa
        run: python scripts/fix-perfect-static-map-layout.py

      - name: Aplicar corrección exacta 10.1
        run: python scripts/apply-v101-exact-map.py

      - name: Aplicar solución web definitiva 10.2
        run: python scripts/apply-v102-web-map.py

      - name: Configurar Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Probar frontend
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm test
          node --check src/app.js
          node --check src/core.js
          node --check src/admin-analytics.js

      - name: Validar solución 10.2
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("web/src/app.js").read_text(encoding="utf-8")
          css = Path("web/assets/styles.css").read_text(encoding="utf-8")
          gradle = Path("android/app/build.gradle.kts").read_text(encoding="utf-8")

          checks = {
              "mapa nativo desactivado":
                  "window.AndroidBridge?.hideNativeMap" in app,
              "mapa HTML con borde rojo":
                  "Combusplus 10.2: mapa integrado" in css and
                  "border:3px solid #d1131b" in css,
              "margen inferior suficiente":
                  "--cp-v102-nav-height" in css,
              "menú inferior fijo":
                  "z-index:2147483640" in css,
              "clave web inyectada":
                  "GOOGLE_MAPS_WEB_API_KEY" in gradle and
                  "webMapsApiKey.get()" in gradle,
          }

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise RuntimeError(
                  "Validaciones fallidas: " + ", ".join(failed)
              )

          print("Combusplus 10.2 validado correctamente")
          PY

      - name: Comprobar script Python
        run: python -m py_compile scripts/apply-v102-web-map.py
