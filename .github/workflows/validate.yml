name: Validar proyecto

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "android/**"
      - "patches/**"
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Aplicar mapa integrado
        run: python scripts/apply-embedded-map-patch.py

      - name: Fijar mapa
        run: python scripts/fix-embedded-map-position.py

      - name: Optimizar mapa
        run: python scripts/optimize-nearby-map.py

      - name: Aplicar marcadores de precio y filtro
        run: python scripts/fix-map-price-markers-and-filter.py

      - name: Aplicar marco exacto y logotipos
        run: python scripts/fix-perfect-map-frame-and-branding.py

      - name: Fijar menú, eliminar hueco y renovar widgets
        run: python scripts/fix-static-nav-gap-and-widgets.py

      - name: Corregir mapa estático y widgets
        run: python scripts/fix-map-static-and-widget-actions.py

      - name: Corregir diseño final del mapa
        run: python scripts/fix-perfect-static-map-layout.py

      - name: Aplicar corrección definitiva 10.0
        run: python scripts/apply-v10-map-widget-layout.py

      - name: Configurar Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Probar frontend
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm test
          node --check src/app.js
          node --check src/core.js
          node --check src/admin-analytics.js

      - name: Validar mapa y widget 10.0
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          required = [
              "android/app/src/main/java/com/grupomds/combusplus/EmbeddedMapController.java",
              "android/app/src/main/res/layout/widget_favorite_prices.xml",
              "patches/v10/EmbeddedMapController.java",
              "patches/v10/widget_favorite_prices.xml",
              "scripts/apply-v10-map-widget-layout.py",
          ]

          for name in required:
              if not Path(name).is_file():
                  raise RuntimeError(f"Falta {name}")

          ET.parse(
              "android/app/src/main/res/layout/"
              "widget_favorite_prices.xml"
          )

          controller = Path(required[0]).read_text(
              encoding="utf-8"
          )
          widget = Path(required[1]).read_text(
              encoding="utf-8"
          )
          app = Path("web/src/app.js").read_text(
              encoding="utf-8"
          )
          css = Path("web/assets/styles.css").read_text(
              encoding="utf-8"
          )

          checks = {
              "recorte antes del menú inferior":
                  "NAV_RESERVED_DP = 78" in controller,
              "mapa sincronizado con scroll":
                  "syncNativeMapFrameV10" in app,
              "pantalla mapa desplazable":
                  "Combusplus 10.0: mapa desplazable" in css,
              "mapa en flujo normal":
                  "position:relative !important" in css,
              "menú inferior fijo":
                  "z-index:2147483000 !important" in css,
              "marcadores circulares":
                  "Bitmap.createBitmap(" in controller and
                  "canvas.drawCircle" in controller,
              "nombres del widget en dos líneas":
                  'android:maxLines="2"' in widget,
              "precio del widget sin corte":
                  'android:id="@+id/favorite_price_1"' in widget and
                  'android:maxLines="1"' in widget,
          }

          failed = [
              name
              for name, valid in checks.items()
              if not valid
          ]

          if failed:
              raise RuntimeError(
                  "Validaciones fallidas: " +
                  ", ".join(failed)
              )

          print("Combusplus 10.0 validado correctamente")
          PY

      - name: Comprobar script Python
        run: |
          python -m py_compile \
            scripts/apply-v10-map-widget-layout.py
