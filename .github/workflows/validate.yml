name: Validar proyecto

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "android/**"
      - "patches/**"
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Aplicar mapa integrado
        run: python scripts/apply-embedded-map-patch.py

      - name: Fijar mapa
        run: python scripts/fix-embedded-map-position.py

      - name: Optimizar mapa
        run: python scripts/optimize-nearby-map.py

      - name: Aplicar marcadores de precio y filtro
        run: python scripts/fix-map-price-markers-and-filter.py

      - name: Aplicar marco exacto y logotipos
        run: python scripts/fix-perfect-map-frame-and-branding.py

      - name: Fijar menú, eliminar hueco y renovar widgets
        run: python scripts/fix-static-nav-gap-and-widgets.py

      - name: Corregir mapa estático y widgets
        run: python scripts/fix-map-static-and-widget-actions.py

      - name: Corregir diseño final del mapa
        run: python scripts/fix-perfect-static-map-layout.py

      - name: Aplicar corrección exacta 10.1
        run: python scripts/apply-v101-exact-map.py

      - name: Aplicar solución web 10.2
        run: python scripts/apply-v102-web-map.py

      - name: Corregir error y scroll 10.3
        run: python scripts/apply-v103-fix-error-scroll.py

      - name: Corregir cabecera y carga del mapa 10.4
        run: python scripts/apply-v104-header-map-load.py

      - name: Aplicar buscadores, filtros y descuentos 10.5
        run: python scripts/apply-v105-search-filters-discounts.py

      - name: Configurar Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Probar frontend
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm test
          node --check src/app.js
          node --check src/core.js
          node --check src/admin-analytics.js

      - name: Validar solución 10.5
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path("web/src/app.js").read_text(encoding="utf-8")
          index = Path("web/index.html").read_text(encoding="utf-8")
          css = Path("web/assets/styles.css").read_text(encoding="utf-8")
          gradle = Path("android/app/build.gradle.kts").read_text(encoding="utf-8")

          checks = {
              "buscador del mapa":
                  'id="mapSearch"' in index and
                  "el.mapSearch?.addEventListener" in app,
              "filtro de nombre en mejor búsqueda":
                  'id="quickStationQuery"' in index and
                  "stationQuery:" in app,
              "filtro de abiertas en mejor búsqueda":
                  'id="quickOpenOnly"' in index and
                  "openOnly:" in app,
              "filtro local de resultados":
                  "stationMatchesBestFiltersV105" in app,
              "descuento visible":
                  'id="bestDiscountBadge"' in index and
                  "discountDisplayV105" in app,
              "estilo de descuento":
                  ".best-discount-badge" in css,
              "versionCode configurable":
                  "COMBUSPLUS_VERSION_CODE" in gradle,
              "versionName configurable":
                  "COMBUSPLUS_VERSION_NAME" in gradle,
              "mapa Google disponible":
                  re.search(
                      r"(?:async\s+)?function\s+loadGoogleMaps\s*\(",
                      app,
                  ) is not None,
          }

          failed = [
              name
              for name, ok in checks.items()
              if not ok
          ]

          if failed:
              raise RuntimeError(
                  "Validaciones fallidas: " +
                  ", ".join(failed)
              )

          print("Combusplus 10.5 validado correctamente")
          PY

      - name: Comprobar script Python
        run: |
          python -m py_compile \
            scripts/apply-v105-search-filters-discounts.py
