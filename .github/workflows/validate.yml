name: Validar proyecto

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "android/**"
      - "patches/**"
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validar Combusplus
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Aplicar mapa integrado
        run: python scripts/apply-embedded-map-patch.py

      - name: Fijar mapa dentro del recuadro
        run: python scripts/fix-embedded-map-position.py

      - name: Optimizar mapa y cargar cercanas
        run: python scripts/optimize-nearby-map.py

      - name: Aplicar marcadores de precio y filtro
        run: python scripts/fix-map-price-markers-and-filter.py

      - name: Aplicar marco exacto y logotipos
        run: python scripts/fix-perfect-map-frame-and-branding.py

      - name: Fijar menú, eliminar hueco y renovar widgets
        run: python scripts/fix-static-nav-gap-and-widgets.py

      - name: Corregir mapa estático y widgets
        run: python scripts/fix-map-static-and-widget-actions.py

      - name: Corregir diseño final del mapa
        run: python scripts/fix-perfect-static-map-layout.py

      - name: Aplicar corrección exacta 10.1
        run: python scripts/apply-v101-exact-map.py

      - name: Aplicar solución web 10.2
        run: python scripts/apply-v102-web-map.py

      - name: Corregir error y scroll 10.3
        run: python scripts/apply-v103-fix-error-scroll.py

      - name: Corregir cabecera y carga del mapa 10.4
        run: python scripts/apply-v104-header-map-load.py

      - name: Aplicar buscadores, filtros y descuentos 10.5
        run: python scripts/apply-v105-search-filters-discounts.py

      - name: Aplicar búsqueda rentable por ruta 10.6.3
        run: python scripts/run-v106-safe.py

      - name: Configurar Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Probar frontend generado
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm test
          node --check src/app.js
          node --check src/core.js
          node --check src/admin-analytics.js

      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.8.1"

      - name: Comprobar función de ruta
        run: deno check supabase/functions/route-recommend/index.ts

      - name: Validar funciones nuevas
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("web/src/app.js").read_text(encoding="utf-8")
          index = Path("web/index.html").read_text(encoding="utf-8")

          checks = {
              "función de depósito única":
                  app.count(
                      "async function runFullTankSearch({"
                  ) == 1,
              "destino disponible":
                  'id="quickDestination"' in index,
              "backend de ruta":
                  "route-recommend" in app,
              "desvío máximo":
                  "maxDetourKm" in app,
              "resumen de ruta":
                  "renderRouteSummaryV106" in app,
          }

          failed = [
              name
              for name, ok in checks.items()
              if not ok
          ]

          if failed:
              raise RuntimeError(
                  "Validaciones fallidas: "
                  + ", ".join(failed)
              )

          print(
              "Combusplus 10.6.3 validado correctamente"
          )
          PY

      - name: Comprobar scripts Python
        run: |
          python -m py_compile \
            scripts/apply-v105-search-filters-discounts.py \
            scripts/apply-v106-route-profitability.py \
            scripts/run-v106-safe.py
