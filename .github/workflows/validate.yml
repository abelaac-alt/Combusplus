name: Validar proyecto

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "android/**"
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Probar frontend
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm test
          node --check src/app.js
          node --check src/core.js
          node --check src/admin-analytics.js

      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Comprobar Edge Functions
        run: |
          set -euo pipefail
          deno check supabase/functions/bootstrap/index.ts
          deno check supabase/functions/recommend/index.ts
          deno check supabase/functions/compare-stations/index.ts
          deno check supabase/functions/stations-nearby/index.ts
          deno check supabase/functions/station-history/index.ts
          deno check supabase/functions/sync-stations/index.ts
          deno check supabase/functions/analytics-event/index.ts
          deno check supabase/functions/admin-analytics/index.ts
          deno check supabase/functions/health/index.ts

      - name: Validar integración Android
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          required = [
              'android/app/build.gradle.kts',
              'android/app/src/main/AndroidManifest.xml',
              'android/app/src/main/java/com/grupomds/combusplus/MainActivity.java',
              'android/app/src/main/java/com/grupomds/combusplus/WebBridge.java',
              'android/app/src/main/java/com/grupomds/combusplus/NativeMapActivity.java',
              'scripts/check-android-artifact.py',
          ]

          for name in required:
              assert Path(name).is_file(), f'Falta {name}'

          ET.parse('android/app/src/main/AndroidManifest.xml')

          gradle = Path('android/app/build.gradle.kts').read_text(encoding='utf-8')
          assert 'play-services-maps:20.0.0' in gradle
          assert 'GOOGLE_MAPS_ANDROID_MAP_ID' in gradle
          assert 'GOOGLE_MAPS_ANDROID_API_KEY' in gradle
          assert "googleMapsKey: ''" in gradle
          assert "googleMapId: ''" in gradle

          manifest = Path('android/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          assert 'com.google.android.geo.API_KEY' in manifest
          assert '.NativeMapActivity' in manifest

          bridge = Path(
              'android/app/src/main/java/com/grupomds/combusplus/WebBridge.java'
          ).read_text(encoding='utf-8')
          assert 'openNativeMap' in bridge

          print('Integración de Google Maps nativo correcta')
          PY

      - name: Comprobar script de seguridad
        run: python -m py_compile scripts/check-android-artifact.py
