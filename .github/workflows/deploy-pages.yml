name: Publicar web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar configuración pública
        run: |
          cat > web/src/runtime-config.js <<EOF
          window.COMBUSPLUS_RUNTIME_CONFIG = {
            supabaseFunctionsUrl: "${{ vars.SUPABASE_FUNCTIONS_URL }}",
            supabasePublishableKey: "${{ vars.SUPABASE_PUBLISHABLE_KEY }}"
          };
          EOF

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir web
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
