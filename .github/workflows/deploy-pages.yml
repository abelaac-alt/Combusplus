name: Publicar web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Validar configuración pública
        env:
          FUNCTIONS_URL: ${{ vars.SUPABASE_FUNCTIONS_URL }}
          PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_MAPS_KEY: ${{ vars.GOOGLE_MAPS_API_KEY }}
        run: |
          test -n "$FUNCTIONS_URL" || { echo "::error::Falta SUPABASE_FUNCTIONS_URL"; exit 1; }
          test -n "$PUBLISHABLE_KEY" || { echo "::error::Falta SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          test -n "$GOOGLE_MAPS_KEY" || { echo "::error::Falta GOOGLE_MAPS_API_KEY"; exit 1; }

      - name: Preparar configuración pública
        env:
          FUNCTIONS_URL: ${{ vars.SUPABASE_FUNCTIONS_URL }}
          PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_MAPS_KEY: ${{ vars.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAP_ID: ${{ vars.GOOGLE_MAP_ID }}
        run: |
          cat > web/config.js <<EOF_CONFIG
          window.COMBUSPLUS_CONFIG = Object.freeze({
            version: '10.6.3',
            supabaseFunctionsUrl: '${FUNCTIONS_URL}',
            supabasePublishableKey: '${PUBLISHABLE_KEY}',
            googleMapsKey: '${GOOGLE_MAPS_KEY}',
            googleMapId: '${GOOGLE_MAP_ID}'
          });
          EOF_CONFIG
          touch web/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Subir web
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
