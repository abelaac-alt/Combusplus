name: Publicar Android (AAB y APK)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Comprobar firma Android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          for value in "$KEYSTORE_B64" "$STORE_PASS" "$KEY_ALIAS_VALUE" "$KEY_PASS"; do
            test -n "$value" || { echo "::error::Faltan secretos de la clave de subida Android."; exit 1; }
          done

      - name: Revisar datos de publicación
        run: |
          if grep -q "Antes de publicar, sustituye este párrafo" web/privacy.html; then
            echo "::warning::La política de privacidad aún contiene el bloque de datos legales pendiente."
          fi
          if [ "${{ vars.PLAY_INTEGRITY_MODE }}" != "enforce" ]; then
            echo "::warning::Play Integrity no está en modo enforce. Es correcto para pruebas internas, pero revísalo antes de producción."
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.4.1"

      - name: Preparar web y clave de subida
        env:
          FUNCTIONS_URL: ${{ vars.SUPABASE_FUNCTIONS_URL }}
          PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_MAPS_KEY: ${{ vars.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAP_ID: ${{ vars.GOOGLE_MAP_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$FUNCTIONS_URL" || { echo "::error::Falta SUPABASE_FUNCTIONS_URL"; exit 1; }
          test -n "$PUBLISHABLE_KEY" || { echo "::error::Falta SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          test -n "$GOOGLE_MAPS_KEY" || { echo "::error::Falta GOOGLE_MAPS_API_KEY"; exit 1; }
          cat > web/config.js <<EOF_CONFIG
          window.COMBUSPLUS_CONFIG = Object.freeze({
            version: '9.0.0',
            supabaseFunctionsUrl: '${FUNCTIONS_URL}',
            supabasePublishableKey: '${PUBLISHABLE_KEY}',
            googleMapsKey: '${GOOGLE_MAPS_KEY}',
            googleMapId: '${GOOGLE_MAP_ID}'
          });
          EOF_CONFIG
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/combusplus-upload.jks
          chmod 600 android/combusplus-upload.jks

      - name: Compilar AAB y APK firmados
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/combusplus-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FUNCTIONS_URL: ${{ vars.SUPABASE_FUNCTIONS_URL }}
          PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          PLAY_PROJECT_NUMBER: ${{ vars.PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
        run: |
          gradle :app:bundleRelease :app:assembleRelease --stacktrace --no-daemon \
            -PCOMBUSPLUS_FUNCTIONS_URL="$FUNCTIONS_URL" \
            -PCOMBUSPLUS_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
            -PPLAY_INTEGRITY_CLOUD_PROJECT_NUMBER="${PLAY_PROJECT_NUMBER:-0}"

      - name: Preparar publicación
        run: |
          mkdir -p release
          cp android/app/build/outputs/bundle/release/app-release.aab release/Combusplus-${{ github.ref_name }}.aab
          cp android/app/build/outputs/apk/release/app-release.apk release/Combusplus-${{ github.ref_name }}.apk
          sha256sum release/* > release/SHA256SUMS.txt
          rm -f android/combusplus-upload.jks

      - name: Subir artefactos
        uses: actions/upload-artifact@v7
        with:
          name: Combusplus-Release-${{ github.run_number }}
          path: release/*
          retention-days: 90
          compression-level: 0

      - name: Crear GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --verify-tag
