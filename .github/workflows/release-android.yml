name: Publicar APK Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.4.1"

      - name: Copiar web dentro de Android
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -R web/. android/app/src/main/assets/www/

      - name: Compilar APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Preparar archivo
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release/Combusplus-${{ github.ref_name }}.apk

      - name: Subir artefacto
        uses: actions/upload-artifact@v7
        with:
          name: Combusplus-Release-${{ github.run_number }}
          path: release/*.apk
          retention-days: 30
          compression-level: 0

      - name: Crear publicación
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
