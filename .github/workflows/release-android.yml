name: Publicar APK Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Comprobar firma Android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          for value in "$KEYSTORE_B64" "$STORE_PASS" "$KEY_ALIAS_VALUE" "$KEY_PASS"; do
            test -n "$value" || { echo "::error::Faltan secretos de firma Android."; exit 1; }
          done

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.4.1'

      - name: Preparar web y firma
        env:
          FUNCTIONS_URL: ${{ vars.SUPABASE_FUNCTIONS_URL }}
          PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          cat > web/config.js <<EOF_CONFIG
          window.COMBUSPLUS_CONFIG = Object.freeze({
            version: '7.0.0',
            supabaseFunctionsUrl: '${FUNCTIONS_URL}',
            supabasePublishableKey: '${PUBLISHABLE_KEY}'
          });
          EOF_CONFIG
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -R web/. android/app/src/main/assets/www/
          rm -rf android/app/src/main/assets/www/tests android/app/src/main/assets/www/package.json android/app/src/main/assets/www/package-lock.json
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/combusplus-release.jks

      - name: Compilar APK y AAB firmados
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/combusplus-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon

      - name: Preparar publicación
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/Combusplus-${{ github.ref_name }}.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release/Combusplus-${{ github.ref_name }}.aab
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Subir artefactos
        uses: actions/upload-artifact@v7
        with:
          name: Combusplus-Release-${{ github.run_number }}
          path: release/*
          retention-days: 90
          compression-level: 0

      - name: Crear Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
